<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <section class="card">
    <section class="profile">
      <img src="./assets/images/image-victor.jpg" alt="Profile Picture">
      <h1>Oluwatobi A. Oreniyi</h1>
      <p>Abuja, Nigeria</p>
      <p>"Front-end developer and avid reader."</p>
    </section>

    <nav class="social-links">
      <a href="#"><button>GitHub</button></a>
      <a href="#"><button>Frontend Mentor</button></a>
      <a href="#"><button>LinkedIn</button></a>
      <a href="#"><button>Twitter</button></a>
      <a href="#"><button>Instagram</button></a>
    </nav>
  </section>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
